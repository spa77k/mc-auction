# AuctionHouse 設定ファイル

auction:
  # 開始価格の下限・上限
  min-price: 10
  max-price: 100000
  # 1人が同時に出品できる件数
  max-listings-per-player: 3
  # 出品期間として選べる時間(このリストの数値のみ受け付ける)
  durations-hours: [6, 12, 24, 48]
  # 出品料 = ceil(開始価格 * listing-fee-rate)、ただし listing-fee-min を下回らない。
  # 出品確定時に徴収し、売れ残り・取り消し・落札のいずれでも返還しない。
  listing-fee-rate: 0.05
  listing-fee-min: 10
  # 成約手数料 = ceil(落札額 * sale-fee-rate)。落札額から差し引いて出品者へ入金する。
  sale-fee-rate: 0.10
  # 最低入札上げ幅 = max(ceil(現在価格 * min-increment-rate), min-increment-flat)
  min-increment-rate: 0.05
  min-increment-flat: 10
  # 終了までこの秒数以内の入札があった場合、終了時刻を extension-seconds 後へ延長する
  extension-threshold-seconds: 180
  extension-seconds: 180
  # 自動延長の最大回数
  max-extensions: 10
  # 出品・入札のチャット入力を何秒放置したら自動キャンセルするか
  input-timeout-seconds: 120
  # 終了済み出品(SOLD/EXPIRED/CANCELLED)の履歴レコードを何日後にデータベースから削除するか。0以下で無効化。
  # 保管庫(vault_items)は対象外で無期限保持する。
  retention-days: 30
  # 出品を禁止するマテリアル名のリスト(空なら制限なし)
  banned-materials: []

# 終了処理・延長チェックの実行間隔(秒)
check-interval-seconds: 5

